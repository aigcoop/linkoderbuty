  <script>
  (() => {
    'use strict';

    const rawData = JSON.parse(document.getElementById('app-data').textContent);
    const CATEGORIES = rawData.categories;
    const PRODUCTS = rawData.products;
    const GCOOP_MALL_URL = 'https://vcshop.gcoop.com/kr';

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const state = {
      category: '전체보기',
      query: '',
      selectedProduct: null,
      modalTab: 'images',
      previewSrc: '',
      personalLinks: safeParse(localStorage.getItem('gcoop_personal_links_v2'), {}),
      customLinks: safeParse(localStorage.getItem('gcoop_custom_links_v2'), [])
    };

    function safeParse(value, fallback) {
      try { return value ? JSON.parse(value) : fallback; } catch (_) { return fallback; }
    }

    function persistPersonalLinks() { localStorage.setItem('gcoop_personal_links_v2', JSON.stringify(state.personalLinks)); }
    function persistCustomLinks() { localStorage.setItem('gcoop_custom_links_v2', JSON.stringify(state.customLinks)); }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      }[char]));
    }

    function normalizeUrl(url) {
      const value = String(url || '').trim();
      if (!value) return '';
      if (/^(https?:|mailto:|tel:)/i.test(value)) return value;
      return 'https://' + value;
    }

    function imagePath(src) {
      const value = String(src || '').trim();
      if (!value) return '';
      if (/^(https?:|data:|blob:)/i.test(value) || value.startsWith('images/')) return value;
      return 'images/' + value;
    }

    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2100);
    }

    async function copyText(text, label = '내용') {
      const value = String(text || '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const area = document.createElement('textarea');
          area.value = value;
          area.style.position = 'fixed';
          area.style.left = '-9999px';
          document.body.appendChild(area);
          area.focus();
          area.select();
          document.execCommand('copy');
          area.remove();
        }
        showToast(label + ' 복사 완료!');
      } catch (error) {
        showToast('복사에 실패했습니다. 주소를 직접 선택해 주세요.');
      }
    }

    async function shareLink(title, url) {
      const safeUrl = normalizeUrl(url);
      if (navigator.share) {
        try { await navigator.share({ title, url: safeUrl }); return; } catch (_) { return; }
      }
      copyText(safeUrl, title || '주소');
    }

    function downloadImage(src, filename) {
      const a = document.createElement('a');
      a.href = imagePath(src);
      a.download = filename || 'gcoop_image.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('이미지 저장을 시작했습니다.');
    }

    function buildThumb(src, alt) {
      const path = imagePath(src);
      const wrap = document.createElement('div');
      wrap.className = 'thumb';
      wrap.innerHTML = '<div class="skeleton"></div>';
      const img = document.createElement('img');
      img.src = path;
      img.alt = alt || '제품 이미지';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onload = () => {
        img.classList.add('loaded');
        const skeleton = $('.skeleton', wrap);
        if (skeleton) skeleton.remove();
      };
      img.onerror = () => {
        wrap.innerHTML = '<div class="missing">▧<br>이미지 없음</div>';
      };
      wrap.appendChild(img);
      return wrap;
    }

    function getFilteredProducts() {
      const query = state.query.trim().toLowerCase();
      return PRODUCTS.filter(product => {
        const categoryOk = state.category === '전체보기' || product.category === state.category;
        if (!categoryOk) return false;
        if (!query) return true;
        const haystack = [product.title, product.category, product.content, product.ingredients].join(' ').toLowerCase();
        return haystack.includes(query);
      });
    }

    function renderCategories() {
      const tabs = $('#categoryTabs');
      tabs.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab' + (cat === state.category ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          state.category = cat;
          render();
        });
        tabs.appendChild(btn);
      });
    }

    function renderProducts() {
      const grid = $('#productGrid');
      const panel = $('#customPanel');
      const meta = $('#mainMeta');
      grid.innerHTML = '';

      if (state.category === '기타링크') {
        grid.style.display = 'none';
        panel.style.display = 'grid';
        meta.innerHTML = '<span>기타링크 관리자</span><span>내 컴퓨터에만 저장됩니다</span>';
        renderCustomLinks();
        return;
      }

      panel.style.display = 'none';
      grid.style.display = 'grid';
      const list = getFilteredProducts();
      meta.innerHTML = `<span>${escapeHtml(state.category)} · ${list.length}개 제품</span><span>${state.query ? '검색어: ' + escapeHtml(state.query) : '제품 카드를 클릭해 상세 정보를 확인하세요'}</span>`;

      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">검색 결과가 없습니다.</div>';
        return;
      }

      list.forEach(product => {
        const card = document.createElement('article');
        card.className = 'card';
        card.tabIndex = 0;
        card.setAttribute('role','button');
        card.setAttribute('aria-label', product.title + ' 상세 보기');
        const thumb = buildThumb(product.images?.[0], product.title);
        card.appendChild(thumb);
        const body = document.createElement('div');
        body.className = 'card-body';
        body.innerHTML = `
          <p class="category">${escapeHtml(product.category)}</p>
          <h3 class="card-title">${escapeHtml(product.title)}</h3>
          <p class="card-desc">${escapeHtml(String(product.content || '').replace(/\[[^\]]+\]/g,'').trim())}</p>`;
        card.appendChild(body);
        card.addEventListener('click', () => openModal(product));
        card.addEventListener('keydown', event => { if (event.key === 'Enter') openModal(product); });
        grid.appendChild(card);
      });
    }

    function renderCustomLinks() {
      const panel = $('#customPanel');
      panel.innerHTML = `
        <div class="box">
          <h2 class="box-title">＋ 새 커스텀 링크 등록</h2>
          <div class="form-grid">
            <input id="customName" class="input" type="text" placeholder="링크 이름 예: 내 블로그, 상담 오픈톡" />
            <input id="customUrl" class="input" type="text" placeholder="URL 예: https://blog.naver.com/..." />
            <button id="addCustomBtn" class="btn btn-primary" type="button">💾 링크 추가하기</button>
          </div>
        </div>
        <div id="customList" class="custom-list"></div>`;

      $('#addCustomBtn').addEventListener('click', () => {
        const name = $('#customName').value.trim();
        const url = normalizeUrl($('#customUrl').value.trim());
        if (!name || !url) { showToast('이름과 URL을 모두 입력해 주세요.'); return; }
        state.customLinks = [{ id: String(Date.now()), name, url, createdAt: Date.now() }, ...state.customLinks];
        persistCustomLinks();
        showToast('새 링크가 추가되었습니다.');
        renderCustomLinks();
      });

      const list = $('#customList');
      if (!state.customLinks.length) {
        list.innerHTML = '<div class="empty">등록된 링크가 없습니다.<br>위에서 새로운 링크를 등록해 보세요.</div>';
        return;
      }
      state.customLinks.forEach(link => {
        const item = document.createElement('article');
        item.className = 'custom-item';
        item.innerHTML = `
          <div class="custom-head">
            <div style="min-width:0">
              <h3 class="custom-name">${escapeHtml(link.name)}</h3>
              <p class="custom-url">${escapeHtml(link.url)}</p>
            </div>
            <button class="btn btn-red custom-delete" type="button" data-id="${escapeHtml(link.id)}">삭제</button>
          </div>
          <div class="custom-actions">
            <a class="btn btn-primary" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">↗ 이동</a>
            <button class="btn btn-slate custom-copy" type="button">복사</button>
            <button class="btn btn-blue custom-share" type="button">공유</button>
          </div>`;
        $('.custom-copy', item).addEventListener('click', () => copyText(link.url, link.name));
        $('.custom-share', item).addEventListener('click', () => shareLink(link.name, link.url));
        $('.custom-delete', item).addEventListener('click', () => {
          state.customLinks = state.customLinks.filter(value => value.id !== link.id);
          persistCustomLinks();
          showToast('링크가 삭제되었습니다.');
          renderCustomLinks();
        });
        list.appendChild(item);
      });
    }

    function openModal(product) {
      state.selectedProduct = product;
      state.modalTab = 'images';
      $('#modalCategory').textContent = product.category;
      $('#modalTitle').textContent = product.title;
      $('#productModal').classList.add('show');
      $('#productModal').setAttribute('aria-hidden','false');
      document.body.classList.add('modal-open');
      updateModalTabs();
      renderModalContent();
    }

    function closeModal() {
      $('#productModal').classList.remove('show');
      $('#productModal').setAttribute('aria-hidden','true');
      document.body.classList.remove('modal-open');
      state.selectedProduct = null;
    }

    function updateModalTabs() {
      $$('.modal-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.modalTab === state.modalTab));
    }

    function renderModalContent() {
      const product = state.selectedProduct;
      const content = $('#modalContent');
      if (!product) return;
      if (state.modalTab === 'images') renderImagesTab(product, content);
      if (state.modalTab === 'info') renderInfoTab(product, content);
      if (state.modalTab === 'links') renderLinksTab(product, content);
    }

    function renderImagesTab(product, content) {
      content.innerHTML = '<div class="image-grid"></div>';
      const grid = $('.image-grid', content);
      (product.images || []).forEach((src, index) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.appendChild(buildThumb(src, product.title + ' 이미지 ' + (index + 1)));
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = index === 0 ? '메인' : '이미지 ' + (index + 1);
        const down = document.createElement('button');
        down.type = 'button';
        down.className = 'download';
        down.textContent = '⬇';
        down.addEventListener('click', event => {
          event.stopPropagation();
          downloadImage(src, `${product.title}_${index + 1}.jpg`);
        });
        card.appendChild(badge);
        card.appendChild(down);
        card.addEventListener('click', () => openPreview(src));
        grid.appendChild(card);
      });
    }

    function renderInfoTab(product, content) {
      content.innerHTML = `
        <section class="info-card">
          <h3 class="info-kicker"><span class="dot"></span> Product Description</h3>
          <p class="info-text">${escapeHtml(product.content || '상품 설명이 없습니다.')}</p>
        </section>
        <section class="info-card">
          <h3 class="info-kicker" style="color:#059669"><span class="dot"></span> Ingredients / 주요 성분</h3>
          <div class="ingredients">${escapeHtml(product.ingredients || '상세 이미지의 성분표를 참고해 주세요.')}</div>
        </section>
        <p style="text-align:center;color:#94a3b8;font-size:11px;font-weight:800;margin:14px 0 0">※ 자세한 전성분과 주의사항은 제품 상세 이미지와 공식몰을 함께 확인해 주세요.</p>`;
    }

    function getMallLinks(product) {
      if (Array.isArray(product.mallUrl)) return product.mallUrl;
      if (product.mallUrl) return [{ label:'쇼핑몰 상세페이지', url: product.mallUrl }];
      return [];
    }

    function renderLinksTab(product, content) {
      const productLinks = state.personalLinks[product.id] || {};
      const mallLinks = getMallLinks(product);
      content.innerHTML = `
        <div class="links-note">ⓘ 파트너님의 마이오피스 링크나 블로그 주소를 등록해 보세요.<br>등록 내용은 현재 브라우저의 로컬 저장소에 저장됩니다.</div>
        <div id="mallLinks"></div>
        <div class="divider"></div>
        <div id="personalLinkList"></div>`;

      const mallBox = $('#mallLinks', content);
      if (!mallLinks.length) {
        mallBox.innerHTML = '<div class="mall-link"><p class="mall-title">공식몰 링크 없음</p></div>';
      } else {
        mallLinks.forEach(link => {
          const safeUrl = normalizeUrl(link.url);
          const block = document.createElement('div');
          block.className = 'mall-link';
          block.innerHTML = `
            <h4 class="mall-title">🛍 ${escapeHtml(link.label || '쇼핑몰 상세페이지')} (클릭시 이동)</h4>
            <a class="mall-url" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(safeUrl)}</a>
            <div class="row-actions">
              <button class="btn btn-slate copy-mall" type="button">복사하기</button>
              <button class="btn btn-primary share-mall" type="button">공유하기</button>
            </div>`;
          $('.copy-mall', block).addEventListener('click', () => copyText(safeUrl, link.label || '상세페이지 주소'));
          $('.share-mall', block).addEventListener('click', () => shareLink(link.label || '상세페이지', safeUrl));
          mallBox.appendChild(block);
        });
      }

      const list = $('#personalLinkList', content);
      [1,2,3,4].forEach(num => {
        const key = 'link' + num;
        const saved = productLinks[key];
        const item = document.createElement('div');
        item.className = 'link-item';
        if (saved && saved.url) {
          const safeUrl = normalizeUrl(saved.url);
          item.innerHTML = `
            <div class="link-item-head"><span class="num">${num}</span><input class="input" value="${escapeHtml(saved.name || '링크 ' + num)}" disabled /></div>
            <input class="input" value="${escapeHtml(safeUrl)}" disabled />
            <div class="link-actions">
              <a class="btn btn-primary wide" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">↗ 링크로 이동</a>
              <button class="btn btn-slate copy-personal" type="button">복사</button>
              <button class="btn btn-blue share-personal" type="button">공유</button>
              <button class="btn btn-red wide delete-personal" type="button">삭제 및 재등록</button>
            </div>`;
          $('.copy-personal', item).addEventListener('click', () => copyText(safeUrl, saved.name || '링크'));
          $('.share-personal', item).addEventListener('click', () => shareLink(saved.name || '링크', safeUrl));
          $('.delete-personal', item).addEventListener('click', () => {
            const next = { ...(state.personalLinks[product.id] || {}) };
            delete next[key];
            state.personalLinks[product.id] = next;
            persistPersonalLinks();
            showToast('링크 정보가 삭제되었습니다.');
            renderLinksTab(product, content);
          });
        } else {
          item.innerHTML = `
            <div class="link-item-head"><span class="num">${num}</span><input class="input link-name" type="text" placeholder="링크 ${num} 이름" value="링크 ${num}" /></div>
            <input class="input link-url" type="text" placeholder="마케팅 URL 예: https://..." />
            <div class="link-actions"><button class="btn btn-primary wide save-personal" type="button">＋ 새 링크 등록하기</button></div>`;
          $('.save-personal', item).addEventListener('click', () => {
            const name = $('.link-name', item).value.trim() || '링크 ' + num;
            const url = normalizeUrl($('.link-url', item).value.trim());
            if (!url) { showToast('URL을 입력해 주세요.'); return; }
            state.personalLinks[product.id] = { ...(state.personalLinks[product.id] || {}), [key]: { name, url } };
            persistPersonalLinks();
            showToast('링크가 로컬 저장소에 저장되었습니다.');
            renderLinksTab(product, content);
          });
        }
        list.appendChild(item);
      });
    }

    function openPreview(src) {
      state.previewSrc = src;
      $('#previewImg').src = imagePath(src);
      $('#imagePreview').classList.add('show');
      $('#imagePreview').setAttribute('aria-hidden','false');
      document.body.classList.add('modal-open');
    }

    function closePreview() {
      $('#imagePreview').classList.remove('show');
      $('#imagePreview').setAttribute('aria-hidden','true');
      $('#previewImg').src = '';
      state.previewSrc = '';
      if (!state.selectedProduct) document.body.classList.remove('modal-open');
    }

    function bindEvents() {
      $('#searchInput').addEventListener('input', event => {
        state.query = event.target.value;
        $('#clearSearchBtn').classList.toggle('show', !!state.query);
        renderProducts();
      });
      $('#clearSearchBtn').addEventListener('click', () => {
        state.query = '';
        $('#searchInput').value = '';
        $('#clearSearchBtn').classList.remove('show');
        renderProducts();
      });
      $('#shareMallBtn').addEventListener('click', () => shareLink('지쿱 쇼핑몰', GCOOP_MALL_URL));
      $('#modalCloseBtn').addEventListener('click', closeModal);
      $('#productModal').addEventListener('click', event => { if (event.target.id === 'productModal') closeModal(); });
      $$('.modal-tab').forEach(tab => tab.addEventListener('click', () => {
        state.modalTab = tab.dataset.modalTab;
        updateModalTabs();
        renderModalContent();
      }));
      $('#previewCloseBtn').addEventListener('click', closePreview);
      $('#imagePreview').addEventListener('click', event => { if (event.target.id === 'imagePreview') closePreview(); });
      $('#previewSaveBtn').addEventListener('click', event => {
        event.stopPropagation();
        downloadImage(state.previewSrc, '지쿱_제품이미지.jpg');
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if ($('#imagePreview').classList.contains('show')) closePreview();
          else if ($('#productModal').classList.contains('show')) closeModal();
        }
      });
    }

    function render() {
      renderCategories();
      renderProducts();
    }

    bindEvents();
    render();
  })();
  </script>
</body>
</html>
