<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지쿱 제품 이미지 및 성분표, 링크오더 보관소</title>
    <!-- 라이브러리 로드 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #f8fafc 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // UI Components
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const OptimizedImage = ({ src, alt, className, aspect = "aspect-square" }) => {
            const [loaded, setLoaded] = useState(false);
            const [error, setError] = useState(false);

            // 이미지 경로 자동 처리 로직 (images/ 폴더 자동 보정)
            const imagePath = useMemo(() => {
                if (!src) return "";
                if (src.startsWith('http') || src.startsWith('blob:') || src.startsWith('data:') || src.startsWith('images/')) {
                    return src;
                }
                return `images/${src}`;
            }, [src]);

            return (
                <div className={`relative overflow-hidden ${aspect} ${className} bg-slate-100`}>
                    {!loaded && !error && <div className="absolute inset-0 skeleton" />}
                    <img 
                        src={imagePath} 
                        alt={alt}
                        loading="lazy"
                        decoding="async"
                        className={`w-full h-full object-cover transition-all duration-700 ${loaded ? 'opacity-100 scale-100' : 'opacity-0 scale-105'}`}
                        onLoad={() => setLoaded(true)}
                        onError={() => { setLoaded(true); setError(true); }}
                    />
                    {error && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-100 text-slate-400 text-[10px]">
                            <Icon name="image-off" size={16} className="mb-1" />
                            이미지 없음
                        </div>
                    )}
                </div>
            );
        };

        const LinkOrderItem = ({ num, data, productId, onSave, onDelete, onCopy, onShare }) => {
            const [name, setName] = useState(data?.name || "");
            const [url, setUrl] = useState(data?.url || "");

            useEffect(() => {
                setName(data?.name || "");
                setUrl(data?.url || "");
            }, [data]);

            const hasData = !!data?.url;

            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:border-indigo-200 transition-colors">
                    <div className="flex flex-col gap-3">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black shadow-sm">{num}</div>
                            <input 
                                type="text"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                placeholder={`링크 ${num} 이름`}
                                disabled={hasData}
                                className={`bg-slate-50 border border-slate-100 rounded-lg px-3 py-1.5 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-100 w-full ${hasData ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700'}`}
                            />
                        </div>
                        <input 
                            type="text" 
                            value={url}
                            onChange={(e) => setUrl(e.target.value)}
                            placeholder="마케팅 URL (https://...)"
                            disabled={hasData}
                            className={`bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-100 transition-all ${hasData ? 'text-slate-400 cursor-not-allowed' : 'text-slate-600'}`}
                        />
                        
                        <div className="grid grid-cols-2 gap-2 mt-1">
                            {!hasData ? (
                                <button 
                                    onClick={() => onSave(productId, num, name || `링크 ${num}`, url)}
                                    disabled={!url}
                                    className={`col-span-2 py-2.5 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 transition-all active:scale-95 ${
                                        !url ? 'bg-slate-100 text-slate-400' : 'bg-indigo-600 text-white shadow-lg shadow-indigo-100'
                                    }`}
                                >
                                    <Icon name="plus-circle" size={12} /> 새 링크 등록하기
                                </button>
                            ) : (
                                <>
                                    <a 
                                        href={url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="col-span-2 bg-indigo-600 text-white py-2.5 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 active:scale-95 shadow-lg shadow-indigo-100"
                                    >
                                        <Icon name="external-link" size={12} /> 링크로 이동 (클릭)
                                    </a>
                                    <button 
                                        onClick={() => onCopy(url, name)}
                                        className="bg-white border border-slate-200 text-slate-700 py-2.5 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95"
                                    >
                                        <Icon name="copy" size={12} /> 복사
                                    </button>
                                    <button 
                                        onClick={() => onShare(name, url)}
                                        className="bg-blue-50 border border-blue-100 text-blue-600 py-2.5 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95"
                                    >
                                        <Icon name="share" size={12} /> 공유
                                    </button>
                                    <button 
                                        onClick={() => onDelete(productId, num)}
                                        className="col-span-2 bg-rose-50 border border-rose-100 text-rose-500 py-2.5 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95 mt-1"
                                    >
                                        <Icon name="trash-2" size={12} /> 링크 삭제 및 재등록
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const LinkOrderTab = ({ product, personalLinks, onSave, onDelete, onCopy, onShare }) => {
            const mallLinks = Array.isArray(product.mallUrl) ? product.mallUrl : (product.mallUrl ? [{ label: "쇼핑몰 상세페이지", url: product.mallUrl }] : []);
            
            return (
                <div className="space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <div className="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100 mb-2">
                        <p className="text-[10px] text-indigo-700 leading-relaxed font-medium">
                            <Icon name="info" size={10} className="inline mr-1 mb-0.5" />
                            파트너님의 마이오피스 링크나 블로그 주소를 등록해 보세요. <br/>
                            한 번 등록된 링크는 삭제 후 다시 등록할 수 있습니다.
                        </p>
                    </div>

                    {mallLinks.map((link, idx) => (
                        <div key={idx} className="bg-white border border-indigo-100 rounded-2xl p-4 shadow-md ring-2 ring-indigo-50 ring-opacity-50 mb-2">
                            <div className="flex items-center justify-between mb-2">
                                <h4 className="text-[11px] font-black text-indigo-600 flex items-center gap-1.5 italic">
                                    <Icon name="shopping-bag" size={12} /> {link.label} (클릭시이동)
                                </h4>
                            </div>
                            <a 
                                href={link.url} 
                                target="_blank" 
                                rel="noopener noreferrer" 
                                className="text-[10px] text-slate-500 hover:text-indigo-600 transition-colors break-all underline decoration-slate-200 underline-offset-4 mb-4 block leading-snug"
                            >
                                {link.url}
                            </a>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => onCopy(link.url, link.label)}
                                    className="flex-1 bg-white border border-slate-200 text-slate-700 py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95 hover:bg-slate-50"
                                >
                                    <Icon name="copy" size={12} /> 복사하기
                                </button>
                                <button 
                                    onClick={() => onShare(link.label, link.url)}
                                    className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95 shadow-lg shadow-indigo-100"
                                >
                                    <Icon name="share-2" size={12} /> 공유하기
                                </button>
                            </div>
                        </div>
                    ))}

                    {mallLinks.length > 0 && <div className="h-px bg-slate-100 my-4 w-full"></div>}

                    {[1, 2, 3, 4].map((num) => (
                        <LinkOrderItem 
                            key={num}
                            num={num}
                            productId={product.id}
                            data={personalLinks?.[`link${num}`]}
                            onSave={onSave}
                            onDelete={onDelete}
                            onCopy={onCopy}
                            onShare={onShare}
                        />
                    ))}
                </div>
            );
        };

        const CustomLinkManager = ({ customLinks, onAdd, onDelete, onCopy, onShare, showToast }) => {
            const [newName, setNewName] = useState("");
            const [newUrl, setNewUrl] = useState("");

            const handleAdd = () => {
                if (!newName || !newUrl) {
                    showToast("이름과 URL을 모두 입력해 주세요.");
                    return;
                }
                onAdd(newName, newUrl);
                setNewName("");
                setNewUrl("");
            };

            return (
                <div className="space-y-6 animate-in fade-in duration-500 max-w-2xl mx-auto">
                    <div className="bg-white border border-indigo-100 rounded-[2rem] p-6 shadow-xl shadow-indigo-50/50">
                        <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2">
                            <Icon name="plus-circle" size={18} className="text-indigo-600" /> 새 커스텀 링크 등록
                        </h3>
                        <div className="space-y-3">
                            <input 
                                type="text" 
                                placeholder="링크 이름 (예: 내 블로그, 상담 오픈톡)"
                                value={newName}
                                onChange={(e) => setNewName(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-xs font-bold outline-none focus:ring-2 focus:ring-indigo-100"
                            />
                            <input 
                                type="text" 
                                placeholder="URL (https://...)"
                                value={newUrl}
                                onChange={(e) => setNewUrl(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-xs outline-none focus:ring-2 focus:ring-indigo-100"
                            />
                            <button 
                                onClick={handleAdd}
                                className="w-full bg-indigo-600 text-white py-3.5 rounded-xl text-xs font-black shadow-lg shadow-indigo-100 active:scale-95 transition-all flex items-center justify-center gap-2"
                            >
                                <Icon name="save" size={14} /> 링크 추가하기
                            </button>
                        </div>
                    </div>

                    <div className="grid gap-4">
                        {customLinks.length === 0 ? (
                            <div className="py-20 text-center text-slate-400">
                                <Icon name="link-2" size={40} className="mx-auto mb-3 opacity-20" />
                                <p className="text-xs font-medium">등록된 링크가 없습니다.<br/>위에서 새로운 링크를 등록해 보세요.</p>
                            </div>
                        ) : (
                            customLinks.map(link => (
                                <div key={link.id} className="bg-white border border-slate-100 rounded-3xl p-5 shadow-sm hover:shadow-md transition-shadow">
                                    <div>
                                        <div className="flex items-center justify-between mb-3">
                                            <div>
                                                <h4 className="text-xs font-black text-slate-800">{link.name}</h4>
                                                <p className="text-[10px] text-slate-400 truncate max-w-[200px] mt-0.5">{link.url}</p>
                                            </div>
                                            <button onClick={() => onDelete(link.id)} className="p-2 text-rose-400 hover:text-rose-600 transition-colors" title="삭제"><Icon name="trash-2" size={18}/></button>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-50">
                                            <a 
                                                href={link.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="bg-indigo-600 text-white py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95 shadow-md shadow-indigo-50"
                                            >
                                                <Icon name="external-link" size={12} /> 이동
                                            </a>
                                            <button 
                                                onClick={() => onCopy(link.url, link.name)}
                                                className="bg-slate-50 text-slate-600 py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95"
                                            >
                                                <Icon name="copy" size={12} /> 복사
                                            </button>
                                            <button 
                                                onClick={() => onShare(link.name, link.url)}
                                                className="bg-blue-50 text-blue-600 py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1.5 active:scale-95"
                                            >
                                                <Icon name="share-2" size={12} /> 공유
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const CATEGORIES = ["전체보기", "케어셀라 뷰티", "텔로메라화장품", "컬러오리진염색약", "리빙", "바이오케이", "기타링크"];

        const PRODUCTS = [
            // --- 텔로메라화장품 ---
            { 
                id: 46, category: "텔로메라화장품", title: "텔로메라 크림", 
                mallUrl: "https://vcshop.gcoop.com/kr/display?cate=290&itemNo=5944", 
                content: "[상품설명]\n피부 시간을 되돌리는 리와인드 크림입니다. 고농축 영양 성분이 피부에 밀착되어 무너진 피부 장벽을 탄탄하게 강화하고 은은한 광채를 선사하는 프리미엄 안티에이징 크림입니다.\n\n[사용방법]\n스킨케어 마지막 단계에서 적당량을 취해 얼굴 전체와 목에 부드럽게 펴 발라 흡수시켜 줍니다.", 
                ingredients: "[전성분]\n정제수, 글리세린, 부틸렌글라이콜, 카프릴릭/카프릭트라이글리세라이드, 시어버터, 나이아신아마이드, 판테놀, 진세노사이드, 아데노신, 하이드롤라이즈드콜라겐, 식물 유래 줄기세포 배양액 등 상세 정보 이미지 참조", 
                images: ["텔로메라크림1.jpg", "텔로메라크림2.jpg", "텔로메라크림3.jpg", "텔로메라크림4.jpg"] 
            },
            { 
                id: 45, category: "텔로메라화장품", title: "텔로메라 세럼", 
                mallUrl: "https://vcshop.gcoop.com/kr/display?cate=290&itemNo=5941", 
                content: "[상품설명]\n피부 자생력을 높여주는 텔로메라 루틴의 핵심 세럼입니다. 풍부한 영양 에너지를 피부 깊숙이 전달하여 탄력 있는 피부결과 맑은 피부톤으로 가꾸어 줍니다.\n\n[사용방법]\n부스터 사용 후 적당량을 펌핑하여 얼굴 전체에 골고루 펴 바르고 가볍게 두드려 흡수시킵니다.", 
                ingredients: "[전성분]\n정제수, 글리세린, 부틸렌글라이콜, 나이아신아마이드, 프로판다이올, 1,2-헥산다이올, 베타인, 세틸에틸헥사노에이트, 스쿠알란, 삼줄기추출물, 삼뿌리추출물, 폴리아크릴레이트크로스폴리머-6, 알란토인, 하이드로제네이티드레시틴 등", 
                images: ["텔로메라세럼1.jpg", "텔로메라세럼2.jpg", "텔로메라세럼3.jpg", "텔로메라세럼4.jpg"] 
            },
            { 
                id: 44, category: "텔로메라화장품", title: "텔로메라 부스터", 
                mallUrl: "https://vcshop.gcoop.com/kr/display?cate=290&itemNo=5943", 
                content: "[상품설명]\n세안 후 피부 시간을 깨우는 첫 단계 리셋 부스터입니다. 다음 단계 제품의 흡수를 돕는 피부 바탕을 만들어주며 즉각적인 수분과 생기를 부여합니다.\n\n[사용방법]\n세안 직후 적당량을 분사하거나 화장솜에 적셔 피부 결을 따라 가볍게 닦아낸 후 흡수시켜 줍니다.", 
                ingredients: "[전성분]\n정제수, 부틸렌글라이콜, 나이아신아마이드, 판테놀, 진세노사이드, 아데노신, 하이드롤라이즈드콜라겐 등 상세 정보 이미지 참조", 
                images: ["텔로메라부스터1.jpg", "텔로메라부스터2.jpg", "텔로메라부스터3.jpg", "텔로메라부스터4.jpg"] 
            },
            { 
                id: 43, category: "텔로메라화장품", title: "텔로메라 3종 세트", 
                mallUrl: [{ label: "텔로메라 3종(3ml) 파우치 세트", url: "https://vcshop.gcoop.com/kr/display?cate=290&itemNo=5983" }, { label: "텔로메라 3종 화장품 세트", url: "https://vcshop.gcoop.com/kr/display?cate=290&itemNo=5964" }], 
                content: "[세트 구성]\n1. 텔로메라 부스터 (120ml / 3ml)\n2. 텔로메라 세럼 (50ml / 3ml)\n3. 텔로메라 크림 (50g / 3g)\n\n[사용방법]\n부스터 -> 세럼 -> 크림 순서로 적당량을 취해 피부에 골고루 펴 바릅니다.", 
                ingredients: "상세 전성분은 제품별 개별 상세 정보 이미지를 참조해 주세요.", 
                images: ["텔로메라파우치1.jpg", "텔로메라파우치2.jpg", "텔로메라화장품세트.jpg", "텔로메라화장품세트2.jpg"] 
            },
            // --- 바이오케이 ---
            {

                content: "[상품설명]\n지쿱 바디워시: 조밀한 거품으로 피부 노폐물을 마일드하게 세정합니다.\n지쿱 바디로션: 끈적임 없이 빠르게 흡수되어 피부에 깊은 보습과 윤기를 제공합니다.\n\n[사용방법]\n바디워시: 샤워용 스펀지에 묻혀 거품을 낸 뒤 전신에 마사지하고 헹굽니다.\n바디로션: 샤워 후 물기를 닦고 전신에 부드럽게 펴 발라 흡수시킵니다.", 
                ingredients: "[전성분]\n바디워시: 정제수, 라우릴글루코사이드, 판테놀 등\n바디로션: 정제수, 호호바씨오일, 시어버터 등 상세 성분 이미지 참조", 
                images: ["바디워시로션1.jpg", "바디워시로션2.jpg", "바디워시로션3.jpg", "바디워시로션4.jpg"] 
            },
            { id: 25, category: "리빙", title: "지쿱 치약", mallUrl: "https://vcshop.gcoop.com/kr/display?cate=8&itemNo=5188", content: "프로폴리스 함유 기능성 치약.", ingredients: "프로폴리스추출물 등", images: ["치약1.jpg", "치약2.jpg", "치약3.jpg", "치약4.jpg"] },
            { id: 26, category: "리빙", title: "지쿱 화이트 치약", mallUrl: "https://vcshop.gcoop.com/kr/display?cate=8&itemNo=3280", content: "미백 기능성 인증 프리미엄 치약.", ingredients: "피로인산나트륨 등", images: ["화이트치약1.jpg", "화이트치약2.jpg", "화이트치약3.jpg", "화이트치약4.jpg"] },
            { id: 27, category: "리빙", title: "지쿱 칫솔", mallUrl: "https://vcshop.gcoop.com/kr/display?cate=8&itemNo=3276", content: "이중 미세모와 인체공학적 설계.", ingredients: "금분 함유 칫솔모", images: ["칫솔1.jpg", "칫솔2.jpg", "칫솔3.jpg", "칫솔4.jpg"] }
        ];

        function App() {
            const [selectedCategory, setSelectedCategory] = useState("전체보기");
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [modalTab, setModalTab] = useState('images');
            const [toast, setToast] = useState(null);
            const [previewImage, setPreviewImage] = useState(null);

            const [personalLinks, setPersonalLinks] = useState(() => {
                const saved = localStorage.getItem('gcoop_personal_links');
                return saved ? JSON.parse(saved) : {};
            });

            const [customLinks, setCustomLinks] = useState(() => {
                const saved = localStorage.getItem('gcoop_custom_links');
                return saved ? JSON.parse(saved) : [];
            });

            const GCOOP_MALL_URL = "https://vcshop.gcoop.com/kr";

            useEffect(() => {
                localStorage.setItem('gcoop_personal_links', JSON.stringify(personalLinks));
            }, [personalLinks]);

            useEffect(() => {
                localStorage.setItem('gcoop_custom_links', JSON.stringify(customLinks));
            }, [customLinks]);

            const filteredProducts = useMemo(() => {
                return PRODUCTS.filter(p => {
                    const matchesCategory = selectedCategory === "전체보기" || p.category === selectedCategory;
                    return matchesCategory && p.title.toLowerCase().includes(searchQuery.toLowerCase());
                });
            }, [selectedCategory, searchQuery]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2000);
            };

            const handleSaveLink = (productId, index, name, url) => {
                if (!url) return;
                setPersonalLinks(prev => ({
                    ...prev,
                    [productId]: {
                        ...prev[productId],
                        [`link${index}`]: { name, url }
                    }
                }));
                showToast("링크가 로컬 저장소에 저장되었습니다.");
            };

            const handleDeleteLink = (productId, index) => {
                setPersonalLinks(prev => {
                    const productData = { ...prev[productId] };
                    delete productData[`link${index}`];
                    return { ...prev, [productId]: productData };
                });
                showToast("링크 정보가 삭제되었습니다.");
            };

            const handleAddCustomLink = (name, url) => {
                setCustomLinks(prev => [{ id: Date.now().toString(), name, url, createdAt: Date.now() }, ...prev]);
                showToast("새 링크가 추가되었습니다.");
            };

            const handleDeleteCustomLink = (id) => {
                setCustomLinks(prev => prev.filter(l => l.id !== id));
                showToast("링크가 삭제되었습니다.");
            };

            const handleCopy = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast(`${label} 복사 완료!`);
            };

            const handleShare = async (title, url) => {
                if (navigator.share) {
                    try { await navigator.share({ title, url }); } catch (e) {}
                } else {
                    handleCopy(url, title);
                }
            };

            const downloadImg = (src, filename) => {
                const a = document.createElement('a');
                const path = (src.startsWith('http') || src.startsWith('images/')) ? src : `images/${src}`;
                a.href = path;
                a.download = filename;
                a.click();
                showToast("이미지 저장 중...");
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b px-4 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
                        <div className="flex items-center gap-2 overflow-hidden">
                            <div className="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-indigo-200 shadow-lg flex-shrink-0">
                                <Icon name="archive" size={18} />
                            </div>
                            <h1 className="text-[13px] font-black text-slate-800 tracking-tighter truncate">
                                지쿱 제품 이미지 및 성분표, 링크오더 보관소
                            </h1>
                        </div>
                        <div className="flex items-center gap-2 flex-wrap">
                            <div className="flex items-center bg-emerald-50 border border-emerald-100 rounded-full p-1 shadow-sm">
                                <a href={GCOOP_MALL_URL} target="_blank" rel="noopener noreferrer" className="text-[10px] font-bold text-emerald-700 px-3 py-1 flex items-center gap-1.5 hover:bg-emerald-100 rounded-full transition-all active:scale-95">
                                    <Icon name="external-link" size={12} /> 지쿱 쇼핑몰 바로가기
                                </a>
                                <button onClick={() => handleShare("지쿱 쇼핑몰", GCOOP_MALL_URL)} className="p-1 text-emerald-600 hover:bg-emerald-200 rounded-full transition-colors ml-1">
                                    <Icon name="share-2" size={14} />
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b sticky top-[65px] sm:top-[65px] z-30 shadow-sm">
                        <div className="px-4 py-3">
                            <div className="relative group">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors" />
                                <input type="text" placeholder="제품명을 검색해 보세요..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border-transparent border focus:border-indigo-200 focus:bg-white rounded-2xl text-xs outline-none transition-all shadow-inner" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                            </div>
                        </div>
                        <div className="flex items-center px-4 overflow-x-auto no-scrollbar pb-3 gap-2">
                            {CATEGORIES.map(cat => (
                                <button key={cat} onClick={() => setSelectedCategory(cat)} className={`whitespace-nowrap px-4 py-2 rounded-xl text-[10px] font-bold transition-all border ${selectedCategory === cat ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-100' : 'bg-slate-50 text-slate-500 border-slate-100 hover:bg-slate-100 active:scale-95'}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="flex-1 p-4 max-w-5xl mx-auto w-full">
                        {selectedCategory === "기타링크" ? (
                            <CustomLinkManager customLinks={customLinks} onAdd={handleAddCustomLink} onDelete={handleDeleteCustomLink} onCopy={handleCopy} onShare={handleShare} showToast={showToast} />
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                {filteredProducts.map(product => (
                                    <div key={product.id} onClick={() => { setSelectedProduct(product); setModalTab('images'); }} className="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all cursor-pointer group active:scale-95">
                                        <OptimizedImage src={product.images[0]} alt={product.title} />
                                        <div className="p-3">
                                            <p className="text-[8px] font-black text-indigo-500 uppercase mb-1 tracking-widest leading-none">{product.category}</p>
                                            <h3 className="font-bold text-[12px] leading-tight text-slate-800 line-clamp-1">{product.title}</h3>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {selectedProduct && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm p-0 sm:p-4" onClick={() => setSelectedProduct(null)}>
                            <div className="bg-white w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[3rem] h-[90vh] sm:h-auto sm:max-h-[85vh] flex flex-col overflow-hidden shadow-2xl relative animate-in slide-in-from-bottom duration-500" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-1 bg-slate-200 rounded-full mx-auto my-3 sm:hidden" />
                                <div className="px-6 py-4 border-b flex items-start justify-between bg-white shrink-0">
                                    <div className="flex-1">
                                        <span className="text-[9px] font-black text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100 uppercase">{selectedProduct.category}</span>
                                        <h2 className="text-xl font-black text-slate-900 mt-2 tracking-tight">{selectedProduct.title}</h2>
                                    </div>
                                    <button onClick={() => setSelectedProduct(null)} className="p-2.5 bg-slate-100 text-slate-400 rounded-2xl active:scale-90 transition-all"><Icon name="x" size={20} /></button>
                                </div>
                                <div className="flex px-6 pt-2 gap-4 border-b shrink-0 overflow-x-auto no-scrollbar bg-white">
                                    {[{ id: 'images', label: '이미지', icon: 'image' }, { id: 'info', label: '상세/성분', icon: 'file-text' }, { id: 'links', label: '내 링크오더', icon: 'link' }].map(tab => (
                                        <button key={tab.id} onClick={() => setModalTab(tab.id)} className={`flex items-center gap-1.5 py-3 text-xs font-bold border-b-2 transition-all whitespace-nowrap ${modalTab === tab.id ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400'}`}>
                                            <Icon name={tab.icon} size={14} /> {tab.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar bg-slate-50/30">
                                    {modalTab === 'images' && (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-in fade-in duration-300">
                                            {selectedProduct.images.map((img, idx) => (
                                                <div key={idx} onClick={() => setPreviewImage(img)} className="relative rounded-3xl overflow-hidden shadow-md border border-slate-200 bg-white cursor-zoom-in group active:scale-[0.98] transition-transform">
                                                    <OptimizedImage src={img} alt={`image-${idx}`} aspect="aspect-square" />
                                                    <div className="absolute top-3 left-3 bg-black/30 backdrop-blur-md text-white text-[9px] px-2.5 py-1 rounded-full font-bold">{idx === 0 ? "메인" : `이미지 ${idx+1}`}</div>
                                                    <button onClick={(e) => { e.stopPropagation(); downloadImg(img, `${selectedProduct.title}_${idx+1}.jpg`); }} className="absolute bottom-3 right-3 p-2.5 bg-white/90 backdrop-blur-sm text-slate-800 rounded-xl shadow-lg active:scale-90 z-10 border border-slate-200">
                                                        <Icon name="download" size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {modalTab === 'info' && (
                                        <div className="space-y-6 animate-in fade-in duration-300">
                                            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                                                <h4 className="text-[10px] font-black text-indigo-500 uppercase mb-2 flex items-center gap-1.5"><div className="w-1 h-1 bg-indigo-500 rounded-full" /> Product Description</h4>
                                                <p className="text-sm text-slate-700 leading-relaxed font-medium whitespace-pre-wrap">{selectedProduct.content}</p>
                                            </div>
                                            <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                                                <h4 className="text-[10px] font-black text-emerald-500 uppercase mb-2 flex items-center gap-1.5"><div className="w-1 h-1 bg-emerald-500 rounded-full" /> Ingredients (주요성분)</h4>
                                                <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-wrap">{selectedProduct.ingredients}</p>
                                            </div>
                                        </div>
                                    )}
                                    {modalTab === 'links' && (
                                        <LinkOrderTab 
                                            product={selectedProduct} 
                                            personalLinks={personalLinks[selectedProduct.id] || {}} 
                                            onSave={handleSaveLink} 
                                            onDelete={handleDeleteLink} 
                                            onCopy={handleCopy} 
                                            onShare={handleShare} 
                                        />
                                    )}
                                </div>
                                <div className="p-4 bg-white border-t safe-bottom">
                                    <p className="text-[10px] text-slate-400 text-center font-medium">© GCOOP Partner PRO HUB - 로컬 관리 도구</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {previewImage && (
                        <div className="fixed inset-0 z-[200] bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200" onClick={() => setPreviewImage(null)}>
                            <button onClick={() => setPreviewImage(null)} className="absolute top-6 right-6 text-white/70 hover:text-white p-2 transition-colors active:scale-90"><Icon name="x" size={32} /></button>
                            <img src={(previewImage.startsWith('http') || previewImage.startsWith('images/')) ? previewImage : `images/${previewImage}`} className="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl animate-in zoom-in-95 duration-300" alt="Expanded view" />
                            <div className="absolute bottom-10 flex gap-4 w-full justify-center px-6">
                                <button onClick={(e) => { e.stopPropagation(); downloadImg(previewImage, "지쿱_제품이미지.jpg"); }} className="bg-indigo-600 text-white px-8 py-4 rounded-2xl shadow-xl flex items-center gap-2 text-sm font-black transition-all active:scale-95">
                                    <Icon name="download" size={18} /> 이미지 원본 저장
                                </button>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[110] bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-[11px] font-bold animate-in fade-in slide-in-from-bottom-4 duration-300 flex items-center gap-2 border border-white/10">
                            <div className="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-pulse" /> {toast}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
